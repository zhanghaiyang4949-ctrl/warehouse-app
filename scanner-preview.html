<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V5 扫码独立验收</title><link rel="stylesheet" href="assets/scanner/scanner.css"><style>body{font:16px/1.6 -apple-system,sans-serif;margin:20px;background:#edf2f8;color:#203e56}main{max-width:600px;margin:auto}button,select,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #c5d4e5;max-width:100%;box-sizing:border-box}textarea{display:block;width:100%;height:180px;margin:12px 0}button{background:#245fc7;color:white}p{font-size:14px}select{width:100%}</style><main><h2>V5 高清扫码验收</h2><p>本页不连接库存、备份或云端。识别只更新下方测试框，可放心测试摄像头。</p><select id="kind"><option value="inExpress">入库（单次）</option><option value="findInput">快速找货（单次）</option><option value="batchFindInput">批量找货（连续去重）</option><option value="packOrdersV83">配货单号（连续，允许重复）</option><option value="blindSortInputW99">分堆（单次，保护未确认内容）</option><option value="dataSearchInput">数据整理（单次）</option></select><textarea id="previewText" placeholder="扫码结果／手动输入"></textarea><button id="open">扫码</button> <button id="clear">清空测试框</button><p id="message">请选择入口，然后扫码。</p></main><script src="assets/scanner/scanner.js"></script><script src="assets/scanner/entries.js"></script><script>
const input=document.getElementById('previewText'),kind=document.getElementById('kind'),message=document.getElementById('message');document.getElementById('clear').onclick=()=>input.value='';document.getElementById('open').onclick=()=>{const id=kind.value,c=WarehouseScannerEntries.targets[id];if(c.protect&&input.value.trim()){message.textContent='请先清空测试框，代表确认上一件';return}V5Scanner.openScanner({mode:c.mode,batch:!!c.batch,title:c.title,isCurrent:()=>true,onResult:r=>{const result=WarehouseScannerEntries.applyScan(id,input,r.text,{query:()=>message.textContent='已模拟调用原查询（不访问库存）',count:()=>message.textContent='已更新测试配货单号'});return result}})};
</script></html>
